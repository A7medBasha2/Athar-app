    <script>
      (function () {
        // 1. Suppress Vite HMR WebSocket unhandled rejections & console errors in preview iframe
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason ? String(reason.message || reason.stack || reason) : '';
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('@vite/client') !== -1 ||
              msg.indexOf('vite') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            var msg = event ? String(event.message || '') : '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        // 2. Wrap native WebSocket so Vite HMR connections fail silently without throwing or rejecting
        if (typeof window.WebSocket === 'function') {
          var NativeWebSocket = window.WebSocket;
          var PatchedWebSocket = function (url, protocols) {
            var isViteHmr =
              (typeof url === 'string' &&
                (url.indexOf('vite') !== -1 || url.indexOf('token=') !== -1)) ||
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);

            if (isViteHmr) {
              // Return an inert mock WebSocket for Vite HMR so it never throws 'WebSocket closed without opened'
              var dummy = {
                url: String(url || ''),
                readyState: 3, // CLOSED
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () {
                  return true;
                },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              return dummy;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
          PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
