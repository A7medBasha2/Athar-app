<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep Serene Matte Obsidian Background -->
    <radialGradient id="sereneObsidian" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141316" />
      <stop offset="65%" stop-color="#0B0B0D" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Satin-Brushed Champagne 24K Gold Ribbon Gradient -->
    <linearGradient id="satinGold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F7E8B5" />
      <stop offset="30%" stop-color="#E2C478" />
      <stop offset="65%" stop-color="#C59E47" />
      <stop offset="100%" stop-color="#8A6823" />
    </linearGradient>

    <!-- Inner Ribbon Shadow Fold Gradient -->
    <linearGradient id="satinFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A762B" />
      <stop offset="50%" stop-color="#D7B665" />
      <stop offset="100%" stop-color="#6B4E15" />
    </linearGradient>

    <!-- Soft Ambient Halo -->
    <filter id="calmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="116" fill="url(#sereneObsidian)" />

  <!-- Whisper-Thin Circular Brushed Gold Medallion Ring -->
  <circle cx="256" cy="256" r="198" stroke="url(#satinGold)" stroke-width="4.5" stroke-opacity="0.88" />
  <circle cx="256" cy="256" r="190" stroke="url(#satinGold)" stroke-width="1" stroke-opacity="0.22" />

  <!-- Bespoke Minimalist Flowing Ribbon Calligraphic Monogram "أثر" -->
  <g filter="url(#calmGlow)">
    <!-- Vertical Flowing Alif (أ) on the Right -->
    <path
      d="M342 164 C324 192 316 232 322 288 C328 342 308 380 266 398 C316 388 346 350 342 286 C337 226 334 196 356 160 Z"
      fill="url(#satinGold)"
    />

    <!-- Serene Upper Crown Sweep & Olive Drop of Impact (أثر) -->
    <path
      d="M214 266 C214 202 268 172 344 150 C358 145 366 134 368 118 C354 148 310 156 266 174 C226 190 206 226 214 266 Z"
      fill="url(#satinGold)"
    />
    <path
      d="M248 164 C278 136 318 134 364 122 C336 146 296 146 248 164 Z"
      fill="url(#satinGold)"
      opacity="0.92"
    />

    <!-- Single Calm Golden Olive-Leaf Droplet Hanging from the Alif Crown -->
    <path
      d="M358 142 C360 166 382 178 370 206 C356 192 354 172 362 158 C364 152 360 146 358 142 Z"
      fill="url(#satinGold)"
    />

    <!-- Flowing Sculpted Ribbon of Tha & Ra (ثـر) -->
    <path
      d="M284 218 C306 248 308 296 272 310 C244 320 226 294 226 246 C206 270 226 312 222 346 C216 388 164 402 120 356 C152 408 216 418 238 364 C246 344 240 318 238 304 C252 326 286 328 298 296 C308 270 296 242 284 218 Z"
      fill="url(#satinGold)"
    />

    <!-- Three Calm Geometric Diamond Dots of Tha (ث) -->
    <polygon points="274,186 283,195 274,204 265,195" fill="url(#satinGold)" />
    <polygon points="288,202 297,211 288,220 279,211" fill="url(#satinGold)" />
    <polygon points="266,204 275,213 266,222 257,213" fill="url(#satinGold)" />
  </g>
</svg>
