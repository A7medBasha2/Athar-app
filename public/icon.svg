<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#080B0E" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" />
  
  <!-- Eight-pointed Islamic Star Accent -->
  <g transform="translate(256, 130) scale(0.6)" fill="none" stroke="url(#goldGrad)" stroke-width="3">
    <rect x="-24" y="-24" width="48" height="48" rx="2" />
    <rect x="-24" y="-24" width="48" height="48" rx="2" transform="rotate(45)" />
    <circle cx="0" cy="0" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Arabic Calligraphy "أثر" -->
  <text x="256" y="300" text-anchor="middle" font-family="'Amiri', 'Cairo', 'Scheherazade New', serif" font-size="140" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">
    أَثَر
  </text>
  
  <!-- Sub-brand "ATHAR" -->
  <text x="256" y="365" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="22" font-weight="600" fill="#E2E8F0" letter-spacing="8" opacity="0.85">
    ATHAR
  </text>
  
  <text x="256" y="398" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="400" fill="#D4AF37" opacity="0.75" letter-spacing="2">
    رفيقك اليومي للقرآن والذكر
  </text>
</svg>
