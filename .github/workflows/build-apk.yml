name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications @capacitor/assets --legacy-peer-deps

      # 🚀 1️⃣ تحديث رقم الإصدار تلقائياً في package.json
      - name: Update App Version
        run: |
          RUN_NUM="${{ github.run_number }}"
          echo "Updating version to 1.0.$RUN_NUM"
          sed -i "s/\"version\": \".*\"/\"version\": \"1.0.$RUN_NUM\"/g" package.json

      - name: Build Web Assets
        run: |
          npm run build
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.athar", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      # 🤖 2️⃣ إعداد Capacitor والأيقونات
      - name: Generate Android Assets Directly From Public Directory
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps

          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          mkdir -p android
          touch android/gradle.properties
          for prop in "android.useAndroidX=true" "android.enableJetifier=true" "android.suppressUnsupportedCompileSdk=36"; do
            if ! grep -q "$prop" android/gradle.properties 2>/dev/null; then
              echo "$prop" >> android/gradle.properties
            fi
          done

          if [ -f "public/royal-athar-icon.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/royal-athar-icon.png --android || true
          elif [ -f "public/icon-logo.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/icon-logo.png --android || true
          fi

      # 🔑 3️⃣ إنشاء Keystore موحد وثابت
      - name: Generate Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "Fixed debug keystore created successfully."

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ⚙️ 4️⃣ بناء الـ APK
      - name: Build Android Debug APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel --stacktrace

      # 📦 5️⃣ نسخ وتغيير امتداد الملف إلى .bin لتجاوز قيود فايربيز المجانية
      - name: Prepare Firebase Hosting Public Directory
        run: |
          mkdir -p firebase-public
          
          # نسخ ملف الـ APK باسم Ath.bin لتخطي قيود ملفات التنفيذ في فايربيز
          cp android/app/build/outputs/apk/debug/app-debug.apk firebase-public/Ath.bin
          
          # حساب حجم الملف الفعلي لكي يتم قراءته بداخل التطبيق شريط التحميل
          APK_SIZE=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)

          RUN_NUM="${{ github.run_number }}"
          cat <<EOF > firebase-public/version.json
          {
            "version": "1.0.$RUN_NUM",
            "buildNumber": $RUN_NUM,
            "title": "تحديث أثر v1.0.$RUN_NUM",
            "notes": "✨ تطبيق أثر - إصدار جديد برقم 1.0.$RUN_NUM\n- تحسين أداء واستقرار النظام.\n- تحديث تلقائي آمن وسريع عبر Firebase.",
            "downloadUrl": "https://athar-e45df.web.app/Ath.bin",
            "apkSize": $APK_SIZE
          }
          EOF

          cat <<EOF > firebase.json
          {
            "hosting": {
              "public": "firebase-public",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ]
            }
          }
          EOF

      # 🔥 6️⃣ الرفع المباشر على Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATHAR }}'
          channelId: live
          projectId: athar-e45df
