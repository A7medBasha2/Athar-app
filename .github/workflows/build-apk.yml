name: Build Android APK & Deploy Live Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Generate Unique Package Version & Capacitor Config
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.athar", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      - name: Deploy Live Update to CapGo
        continue-on-error: true
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -n "$CAPGO_TOKEN" ]; then
            npx @capgo/cli@latest bundle upload --channel production || echo "CapGo upload failed, continuing..."
          else
            echo "CAPGO_TOKEN not configured in secrets, skipping CapGo upload..."
          fi

      - name: Sync Web Assets & Preserve Native Services & Royal Icons
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          mkdir -p android
          touch android/gradle.properties
          for prop in "android.useAndroidX=true" "android.enableJetifier=true" "android.suppressUnsupportedCompileSdk=36"; do
            if ! grep -q "$prop" android/gradle.properties 2>/dev/null; then
              echo "$prop" >> android/gradle.properties
            fi
          done

          RES_DIR="android/app/src/main/res"
          ICON_SRC="public/royal-athar-icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC="public/icon-logo.png"
          fi

          mkdir -p "$RES_DIR/values"
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          mkdir -p "$RES_DIR/drawable"

          cat << "EOF" > "$RES_DIR/values/colors.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#070605</color>
              <color name="colorPrimary">#D4AF37</color>
              <color name="colorPrimaryDark">#070605</color>
              <color name="colorAccent">#E6C66E</color>
          </resources>
          EOF

          cat << "EOF" > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << "EOF" > "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          if [ -f "$ICON_SRC" ]; then
            for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              IFS=":" read -r d sz <<< "$item"
              mkdir -p "$RES_DIR/mipmap-$d"
              cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher.png"
              cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher_round.png"
              cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher_foreground.png"
            done
            cp "$ICON_SRC" "$RES_DIR/drawable/ic_launcher.png"
            cp "$ICON_SRC" "$RES_DIR/drawable/ic_launcher_round.png"
            cp "$ICON_SRC" "android/app/src/main/ic_launcher-playstore.png"
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Android Debug APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
