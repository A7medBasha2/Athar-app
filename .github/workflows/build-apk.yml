name: Build and Release Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications @capacitor/assets --legacy-peer-deps

      # 🚀 1️⃣ تحديث رقم الإصدار تلقائياً في package.json
      - name: Update App Version
        run: |
          RUN_NUM="${{ github.run_number }}"
          echo "Updating version to 1.0.$RUN_NUM"
          sed -i "s/\"version\": \".*\"/\"version\": \"1.0.$RUN_NUM\"/g" package.json

      - name: Build Web Assets
        run: |
          npm run build
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.athar", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      # 🤖 2️⃣ إعداد Capacitor والأيقونات (تم نقلها لتنشئ مجلد android أولاً)
      - name: Generate Android Assets
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps

          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          mkdir -p android
          touch android/gradle.properties
          for prop in "android.useAndroidX=true" "android.enableJetifier=true" "android.suppressUnsupportedCompileSdk=36"; do
            if ! grep -q "$prop" android/gradle.properties 2>/dev/null; then
              echo "$prop" >> android/gradle.properties
            fi
          done

          if [ -f "public/royal-athar-icon.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/royal-athar-icon.png --android || true
          elif [ -f "public/icon-logo.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/icon-logo.png --android || true
          fi

      # 🔑 3️⃣ إنشاء ملف Keystore إنتاجي (Release Keystore) وتثبيته
      - name: Generate Permanent Release Keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -storepass athar123456 \
            -alias athar-key \
            -keypass athar123456 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Athar, OU=AtharApp, O=Athar, L=Cairo, ST=Cairo, C=EG"
          echo "Release keystore generated successfully inside android/app."

      # ⚙️ 4️⃣ حقن إعدادات التوقيع (Signing Config) داخل ملف build.gradle للأندرويد
      - name: Inject Signing Config into Gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          
          if [ -f "$GRADLE_FILE" ] && ! grep -q "signingConfigs" "$GRADLE_FILE"; then
            sed -i '/buildTypes {/,/}/c\
            signingConfigs {\
                release {\
                    storeFile file("release.keystore")\
                    storePassword "athar123456"\
                    keyAlias "athar-key"\
                    keyPassword "athar123456"\
                }\
            }\
            buildTypes {\
                release {\
                    signingConfig signingConfigs.release\
                    minifyEnabled false\
                    proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\
                }\
                debug {\
                    signingConfig signingConfigs.release\
                }\
            }' "$GRADLE_FILE"
            echo "Signing config injected successfully."
          else
            echo "Gradle file not found or already injected."
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ⚙️ 5️⃣ بناء الـ APK بنسخة Release موقعة رسمياً وثابتة
      - name: Build Android Release APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/athar-app.apk

      # 📦 6️⃣ النشر التلقائي على GitHub Releases
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: v1.0.${{ github.run_number }} تحديث أثر (Release)
          body: |
            ✨ تطبيق أثر - إصدار رسمي موقّع رقم 1.0.${{ github.run_number }}
            - تم اعتماد توقيع Release دائم لإنهاء مشكلة تعارض التوقيع نهائياً.
            - التحديث التلقائي القادم سيعمل بسلاسة تامة.
          files: android/app/build/outputs/apk/release/athar-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
