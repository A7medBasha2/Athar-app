name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications @capacitor/assets --legacy-peer-deps

      # 🚀 1️⃣ تحديث رقم الإصدار تلقائياً في package.json قبل بناء الـ Assets
      - name: Update App Version
        run: |
          RUN_NUM="${{ github.run_number }}"
          echo "Updating version to 1.0.$RUN_NUM"
          
          # تحديث package.json تلقائياً برقم الـ Run الحالي
          sed -i "s/\"version\": \".*\"/\"version\": \"1.0.$RUN_NUM\"/g" package.json

      - name: Build Web Assets
        run: |
          npm run build
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.athar", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      # 🤖 2️⃣ توليد أيقونات الأندرويد وإعداد Capacitor
      - name: Generate Android Assets Directly From Public Directory
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps

          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          mkdir -p android
          touch android/gradle.properties
          for prop in "android.useAndroidX=true" "android.enableJetifier=true" "android.suppressUnsupportedCompileSdk=36"; do
            if ! grep -q "$prop" android/gradle.properties 2>/dev/null; then
              echo "$prop" >> android/gradle.properties
            fi
          done

          if [ -f "public/royal-athar-icon.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/royal-athar-icon.png --android || true
          elif [ -f "public/icon-logo.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/icon-logo.png --android || true
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ⚙️ 3️⃣ بناء ملف الـ APK
      - name: Build Android Debug APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel --stacktrace

      # 🏷️ 4️⃣ إعادة تسمية ملف الـ APK إلى Athar.apk
      - name: Rename APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Athar.apk

      # 📦 معلومات الملف
      - name: APK Info
        run: |
          APK="android/app/build/outputs/apk/debug/Athar.apk"
          ls -lh "$APK"
          echo "### حجم الـ APK: $(du -h "$APK" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "MD5: $(md5sum "$APK" | cut -d' ' -f1)" >> $GITHUB_STEP_SUMMARY

      # ✅ 5️⃣ رفع الـ APK باسمه الجديد على Release
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: أَثَرُ build ${{ github.run_number }}
          body: |
            نسخة تلقائية رقم ${{ github.run_number }}
            - الإصدار: 1.0.${{ github.run_number }}
            - الـ commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/Athar.apk
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
