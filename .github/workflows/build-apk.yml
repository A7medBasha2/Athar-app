name: Build APK & Deploy Live Update

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      # 🚀 1. رفع التحديث الهوائي أونلاين لـ CapGo
      - name: Deploy Live Update to CapGo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx @capgo/cli upload -t $CAPGO_TOKEN -c production

      # 🤖 2. بناء ملف الـ APK الأساسي
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Expose Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $ENV

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
