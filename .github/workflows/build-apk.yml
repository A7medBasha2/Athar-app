name: Build Android APK & Deploy Live Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      # 🚀 1️⃣ تعيين رقم إصدار فريد وتوليد capacitor.config.json بـ appId المعتمد (com.athar.athar)
      - name: Generate Unique Package Version & Capacitor Config
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.athar", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      # 🚀 2️⃣ رفع الـ Live Update لأداة CapGo
      - name: Deploy Live Update to CapGo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx @capgo/cli@latest bundle upload --channel production

      # 🤖 3️⃣ إعداد الأندرويد، الأذونات كاملة، وتطبيق الأيقونة الجديدة (icon-logo.png)
      - name: Setup Android, Universal Permissions & Custom Icon
        run: |
          rm -rf android
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap add android

          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            PERMISSIONS='    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />'
            sed -i "/<\/manifest>/i $PERMISSIONS" $MANIFEST_PATH
          fi

          ICON_SRC="public/athar-royal-icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC="public/icon-logo.png"
          fi

          if [ -f "$ICON_SRC" ]; then
            RES_DIR="android/app/src/main/res"
            rm -rf $RES_DIR/mipmap-v26/ic_launcher.xml
            rm -rf $RES_DIR/mipmap-v26/ic_launcher_round.xml
            rm -rf $RES_DIR/drawable/ic_launcher_background.xml
            rm -rf $RES_DIR/drawable-v24/ic_launcher_foreground.xml

            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "$RES_DIR/mipmap-$d"
              case $d in
                mdpi) sz=48 ;;
                hdpi) sz=72 ;;
                xhdpi) sz=96 ;;
                xxhdpi) sz=144 ;;
                xxxhdpi) sz=192 ;;
              esac
              if command -v convert >/dev/null 2>&1; then
                convert "$ICON_SRC" -resize "${sz}x${sz}" "$RES_DIR/mipmap-$d/ic_launcher.png"
                convert "$ICON_SRC" -resize "${sz}x${sz}" "$RES_DIR/mipmap-$d/ic_launcher_round.png"
              else
                cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher.png"
                cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher_round.png"
              fi
            done
            cp "$ICON_SRC" "$RES_DIR/drawable/ic_launcher.png"
            cp "$ICON_SRC" "$RES_DIR/drawable/ic_launcher_round.png"
            cp "$ICON_SRC" "android/app/src/main/ic_launcher-playstore.png"
          fi

          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
