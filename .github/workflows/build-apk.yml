name: Build Android APK & Deploy Live Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications @capacitor/assets --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      # 🚀 1️⃣ تعيين رقم إصدار فريد وتوليد capacitor.config.json بـ appId المعتمد (com.athar.athar)
      - name: Generate Unique Package Version & Capacitor Config
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version || true
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.athar", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      # 🤖 2️⃣ تنظيف وبناء منصة الأندرويد مع تنظيف ملفات الأيقونات المتعارضة
      - name: Clean & Recreate Android Platform Safely
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -rf android
          npx cap add android
          npx cap sync android

          # ضمان تفعيل خاصية AndroidX ودعم SDK 36 في gradle.properties
          mkdir -p android
          touch android/gradle.properties
          for prop in "android.useAndroidX=true" "android.enableJetifier=true" "android.suppressUnsupportedCompileSdk=36"; do
            if ! grep -q "$prop" android/gradle.properties 2>/dev/null; then
              echo "$prop" >> android/gradle.properties
            fi
          done

          # 🎨 تشغيل سكريبت الأيقونات وتطهير الملفات المتكررة تلقائياً لضمان ظهور الأيقونة الملكية
          if [ -f "scripts/generate-launcher-icons.cjs" ]; then
            node scripts/generate-launcher-icons.cjs || true
          fi

          # حذف أي تعارض متكرر في ملفات ic_launcher_background المسببة للمشكلة
          rm -f android/app/src/main/res/values/ic_launcher_background.xml
          find android/app/src/main/res/values* -name "colors.xml" -exec sed -i '/ic_launcher_background/d' {} + || true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      # ⚙️ 3️⃣ بناء ملف الـ APK
      - name: Build Android Debug APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 🚀 4️⃣ رفع الـ Live Update لأداة CapGo
      - name: Deploy Live Update to CapGo
        continue-on-error: true
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -n "$CAPGO_TOKEN" ]; then
            npx @capgo/cli@latest bundle upload --channel production || echo "CapGo upload failed, continuing..."
          else
            echo "CAPGO_TOKEN not configured in secrets, skipping CapGo upload..."
          fi
