name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications @capacitor/assets --legacy-peer-deps

      - name: Update App Version
        run: |
          RUN_NUM="${{ github.run_number }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"1.0.$RUN_NUM\"/g" package.json

      - name: Build Web Assets
        run: |
          npm run build
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.athar", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      - name: Sync Capacitor & Generate Assets
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          mkdir -p android
          touch android/gradle.properties
          for prop in "android.useAndroidX=true" "android.enableJetifier=true" "android.suppressUnsupportedCompileSdk=36"; do
            if ! grep -q "$prop" android/gradle.properties 2>/dev/null; then
              echo "$prop" >> android/gradle.properties
            fi
          done

          if [ -f "public/royal-athar-icon.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/royal-athar-icon.png --android || true
          elif [ -f "public/icon-logo.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/icon-logo.png --android || true
          fi

      # 🔑 إنشاء وحفظ مفتاح Release ثابت دائم في الريبو
      - name: Ensure Permanent Release Keystore
        run: |
          KEYSTORE_PATH="release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Creating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias releasekey \
              -storepass "athar2026key" \
              -keypass "athar2026key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Athar App, O=Athar, C=EG"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "chore: save permanent release keystore [skip ci]"
            git push origin main || true
          fi

      # ⚙️ ربط المفتاح في build.gradle لفرض التوقيع الموحد
      - name: Force Gradle Release Signing
        run: |
          python3 -c "
          import os

          build_gradle = 'android/app/build.gradle'
          if os.path.exists(build_gradle):
              with open(build_gradle, 'r') as f:
                  content = f.read()

              signing_code = '''
          android {
              signingConfigs {
                  release {
                      storeFile file('../../release.keystore')
                      storePassword 'athar2026key'
                      keyAlias 'releasekey'
                      keyPassword 'athar2026key'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''
              if 'release.keystore' not in content:
                  with open(build_gradle, 'a') as f:
                      f.write(signing_code)
          "

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel
          
          mkdir -p ../output_apk
          cp app/build/outputs/apk/debug/app-debug.apk ../output_apk/athar-app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: v1.0.${{ github.run_number }} تحديث أثر
          body: |
            ✨ تطبيق أثر - إصدار رقم 1.0.${{ github.run_number }}
          files: output_apk/athar-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
