name: Build and Release Production APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install react-is --save --legacy-peer-deps
          npm install --legacy-peer-deps
          npm install @capacitor/local-notifications @capacitor/assets --legacy-peer-deps

      - name: Update App Version
        run: |
          RUN_NUM="${{ github.run_number }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"1.1.$RUN_NUM\"/g" package.json

      - name: Build Web Assets
        run: |
          npm run build
          mkdir -p www
          cp -r dist/* www/
          echo '{"appId": "com.athar.islamic", "appName": "أَثَرُ", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      - name: Sync Capacitor & Generate Assets
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          mkdir -p android
          touch android/gradle.properties
          for prop in "android.useAndroidX=true" "android.enableJetifier=true" "android.suppressUnsupportedCompileSdk=36"; do
            if ! grep -q "$prop" android/gradle.properties 2>/dev/null; then
              echo "$prop" >> android/gradle.properties
            fi
          done

          if [ -f "public/royal-athar-icon.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/royal-athar-icon.png --android || true
          elif [ -f "public/icon-logo.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --assetPath public/icon-logo.png --android || true
          fi

      - name: Inject google-services.json
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build & Sign Release Artifacts (APK & AAB)
        env:
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'athar2026key' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'releasekey' }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || 'athar2026key' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'athar2026key' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'releasekey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || 'athar2026key' }}
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

          # If custom base64 keystore secret is configured, restore it; otherwise use repository keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ../release.keystore
          fi

          # Build both Universal Release APK and Google Play App Bundle (AAB)
          ./gradlew assembleRelease bundleRelease --build-cache --parallel

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          RAW_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          mkdir -p ../output_artifacts

          # 1. Align and Sign Universal APK for direct release
          if [ -f "$RAW_APK" ]; then
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" ../output_artifacts/aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks ../release.keystore \
              --ks-pass pass:"$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"$KEY_PASS" \
              --out ../output_artifacts/athar-app.apk \
              ../output_artifacts/aligned.apk
            
            echo "Universal Release APK generated and signed successfully."
            $BUILD_TOOLS_DIR/apksigner verify --verbose --print-certs ../output_artifacts/athar-app.apk || true
          fi

          # 2. Package and Sign Android App Bundle (AAB) for Google Play Store upload
          if [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" ../output_artifacts/athar-release.aab
            jarsigner -keystore ../release.keystore \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              ../output_artifacts/athar-release.aab "$KEY_ALIAS" || true
            echo "Production Release AAB (Android App Bundle) generated and signed successfully."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: v1.1.${{ github.run_number }} - تحديث أثر الملكي
          body: |
            ✨ **تطبيق أثر - الإصدار الإنتاجي v1.1.${{ github.run_number }}**
            
            📦 **الحزم المنتجة (Production Release Artifacts)**:
            - `athar-app.apk`: الحزمة الشاملة الموقعة للتثبيت المباشر على جميع هواتف أندرويد (Universal Release APK).
            - `athar-release.aab`: الحزمة الرسمية الموقعة والمجهزة للرفع المباشر على متجر Google Play (Android App Bundle).
            
            🔐 **معلومات التوقيع والأمان**:
            - Application ID: `com.athar.islamic`
            - Target SDK: 36 (Android 15)
            - Min SDK: 26 (Android 8.0+)
            - الامتثال: معيار OWASP MASVS v2 و Google Play Data Safety
          files: |
            output_artifacts/athar-app.apk
            output_artifacts/athar-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
