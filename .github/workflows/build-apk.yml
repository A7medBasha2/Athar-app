name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Generate Assets and Add Android
        run: |
          mkdir -p www
          cp -r dist/* www/
          rm -rf android
          echo '{"appId": "com.athar.app", "appName": "أثر", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json
          npm install @capacitor/cli @capacitor/android @capacitor/assets --legacy-peer-deps
          
          # نسخ اللوجو من مجلد public ليتم استخدامه كأيقونة رئيسية
          if [ -f "public/athar-royal-icon.png" ]; then
            mkdir -p assets
            cp public/athar-royal-icon.png assets/logo.png
          fi

          npx cap add android

          # توليد الأيقونات في مشروع أندرويد
          if [ -f "assets/logo.png" ]; then
            npx capacitor-assets generate --iconPath assets/logo.png --android
          fi

          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
