name: Deploy Capgo Update
on:
  push:
    tags:
      - 'v*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Upload to Capgo
        run: npx @capgo/cli app upload -k ${{ secrets.CAPGO_TOKEN }}
