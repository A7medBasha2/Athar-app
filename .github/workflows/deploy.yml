name: Deploy Capgo Update

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capgo/capacitor-updater --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Set dynamic version in package.json
        run: |
          node -e "const pkg = require('./package.json'); pkg.version = '1.0.${{ github.run_number }}'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

      - name: Create capacitor config
        run: |
          echo '{"appId": "com.athar.athar", "appName": "Athar", "webDir": "dist"}' > capacitor.config.json

      - name: Upload to Capgo
        run: npx @capgo/cli@latest bundle upload --path ./dist --channel production
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
