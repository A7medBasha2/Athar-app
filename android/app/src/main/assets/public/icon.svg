<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep Royal Obsidian Background -->
    <radialGradient id="obsidianBg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#18161A" />
      <stop offset="65%" stop-color="#0E0D10" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- 24K Burnished Royal Gold Gradient -->
    <linearGradient id="imperialGold" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FFF5C8" />
      <stop offset="25%" stop-color="#EBC872" />
      <stop offset="65%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#8A631A" />
    </linearGradient>

    <!-- Subtle Golden Edge Glow -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer App Icon Squircle with Burnished Gold Border -->
  <rect width="512" height="512" rx="118" fill="url(#obsidianBg)" />
  <rect x="6" y="6" width="500" height="500" rx="112" stroke="url(#imperialGold)" stroke-width="4" stroke-opacity="0.65" fill="none" />

  <!-- Centered Royal Golden Mihrab Emblem -->
  <image href="/athar-royal-icon.png" x="86" y="46" width="340" height="420" preserveAspectRatio="xMidYMid contain" />
</svg>
