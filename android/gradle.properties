# Project-wide Gradle settings for Athar (com.athar.athar)
# JVM & Memory Optimization (4GB Heap for fast DEX & Kotlin compilation)
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Gradle Execution Optimization Flags
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.vfs.watch=true

# Incremental Compilation Acceleration
kotlin.incremental=true
ksp.incremental=true

# AndroidX and Platform Compatibility
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36

# Kotlin Code Style
kotlin.code.style=official
